<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Page introuvable (404) - Dream Catcher</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, rgba(11, 14, 13, 0.95) 0%, rgba(26, 21, 37, 0.9) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      color: #F5F2EB;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(232, 164, 208, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(179, 136, 221, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(245, 210, 128, 0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .error-container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
    }

    .error-card {
      background: linear-gradient(145deg, rgba(18, 36, 30, 0.95), rgba(26, 21, 37, 0.9));
      border: 2px solid rgba(232, 164, 208, 0.3);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(232, 164, 208, 0.2);
    }

    .error-icon {
      font-size: 5rem;
      color: #f5d280;
      margin-bottom: 1.5rem;
      display: block;
      animation: sparkle 2s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.1);
      }
    }

    .error-code {
      font-family: 'Cinzel', serif;
      font-size: 4rem;
      font-weight: 700;
      color: #f5d280;
      text-shadow:
        0 0 20px rgba(245, 210, 128, 0.5),
        0 0 40px rgba(232, 164, 208, 0.3);
      margin-bottom: 1rem;
      letter-spacing: 4px;
    }

    .error-title {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 600;
      color: #f5d280;
      margin-bottom: 1rem;
    }

    .error-message {
      font-size: 1.2rem;
      color: rgba(245, 242, 235, 0.8);
      margin-bottom: 2rem;
      line-height: 1.6;
      font-style: italic;
    }

    .error-link {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: linear-gradient(145deg, rgba(27, 77, 62, 0.8), rgba(46, 125, 102, 0.6));
      border: 2px solid rgba(245, 210, 128, 0.4);
      border-radius: 12px;
      color: #f5d280;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(27, 77, 62, 0.35);
    }

    .error-link:hover {
      border-color: rgba(245, 210, 128, 0.7);
      background: linear-gradient(145deg, rgba(27, 77, 62, 0.95), rgba(46, 125, 102, 0.8));
      box-shadow: 0 6px 20px rgba(245, 210, 128, 0.3);
      transform: translateY(-2px);
      color: #f5d280;
    }

    @media (max-width: 575.98px) {
      .error-card {
        padding: 2rem 1.5rem;
      }

      .error-code {
        font-size: 3rem;
      }

      .error-title {
        font-size: 1.5rem;
      }

      .error-message {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-card">
      <i class="bi bi-moon-stars error-icon"></i>
      <div class="error-code">404</div>
      <h1 class="error-title">Page introuvable</h1>
      <p class="error-message">
        La page que vous cherchez semble s'être évanouie dans les brumes du rêve...
        <br>Elle a peut-être été déplacée ou n'existe plus.
      </p>
      <a href="/" class="error-link">
        <i class="bi bi-house-door"></i> Retour à l'accueil
      </a>
    </div>
  </div>
</body>
</html>
